name: Build & Deploy TW Airline Analyzer to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Run automatically on the 26th of every month at 02:00 UTC (10:00 Taipei time)
    - cron: "0 2 26 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Sync Taiwan CAA Passenger Data (2009-present)
        run: npm run sync

      - name: Sync Taiwan CAA Cargo & OTP Data
        run: npm run sync:tw-extra

      - name: Export Static JSON Bundles
        run: npm run export:static

      - name: Build Frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
